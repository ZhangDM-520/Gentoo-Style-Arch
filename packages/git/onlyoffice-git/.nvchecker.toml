# ONLYOFFICE Desktop Editors, tracking upstream release tags.
#
# The repository publishes vX.Y.Z tags only (twice 13 releases back it switches
# to the legacy ONLYOFFICE-DesktopEditors-6.0.x form, which the anchored
# include_regex rejects). The build number the package version carries
# (X.Y.Z.NNN) is not a DesktopEditors tag at all - it lives in the ten module
# repositories - so it is deliberately not what is tracked here: the build
# number only ever moves when a release moves, and 9.5.0 compares newer than
# 9.4.0.130, so a new release always sorts above the installed package.
#
# A reported update means: bump _oo_release, run ./sync-submodules.sh --write,
# then follow BUILDING. nvchecker cannot see the pins, only the release.
[onlyoffice-git]
source = "git"
git = "https://github.com/ONLYOFFICE/DesktopEditors.git"
prefix = "v"
include_regex = 'v\d+\.\d+\.\d+$'
